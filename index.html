<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="Terminal rétro avec effets CRT et commandes interactives. Une expérience de terminal nostalgique dans votre navigateur.">
  <meta name="keywords" content="terminal, retro, CRT, command line, saumon, vintage, console">
  <meta name="author" content="Saumon">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Saumon Terminal">
  <meta name="apple-touch-fullscreen" content="yes">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Saumon Terminal - Terminal Rétro</title>
  <link rel="manifest" href="manifest.json">
  
  <style>
    /* Gestion optimisée du clavier virtuel mobile */
    html {
      margin: 0;
      padding: 0;
      background-color: #000000;
      /* Support pour les nouvelles unités viewport dynamique */
      height: 100dvh;
      width: 100dvw;
      overflow: hidden;
    }
    
    body {
      margin: 0;
      padding: 0;
      background-color: #000000;
      height: 100dvh;
      width: 100dvw;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      /* Prévenir le bounce sur iOS */
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: none;
    }
    
    /* Configuration spécifique pour le clavier virtuel */
    @supports (height: 100dvh) {
      html, body {
        height: 100dvh; /* Dynamic viewport height - s'adapte au clavier */
      }
    }
    
    /* Fallback pour navigateurs sans support dvh */
    @supports not (height: 100dvh) {
      html, body {
        height: calc(var(--vh, 1vh) * 100);
      }
    }
    
    /* Prévenir les comportements indésirables du clavier sur mobile */
    input, textarea {
      font-size: 16px !important; /* Prévenir le zoom automatique sur iOS */
      -webkit-user-select: text;
      user-select: text;
    }
    
    /* Container principal Flutter */
    #app-body {
      height: 100%;
      width: 100%;
      background-color: #000000;
      position: relative;
      overflow: hidden;
    }
    
    /* Assurer que Flutter s'affiche par-dessus tout */
    flutter-view {
      height: 100% !important;
      width: 100% !important;
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      background-color: #000000 !important;
    }
    
    /* Masquer toute barre de défilement sur mobile */
    ::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }
    
    /* Styles spécifiques iOS */
    @supports (-webkit-touch-callout: none) {
      body {
        /* Prévenir le rebond sur iOS */
        -webkit-overflow-scrolling: touch;
        overscroll-behavior-y: none;
      }
    }
  </style>
</head>
<body id="app-body">
  <!-- Input caché pour iOS Safari fallback -->
  <input id="ios-keyboard-helper" type="text" style="position: absolute; left: -9999px; opacity: 0; pointer-events: none;" readonly>
  
  <script>
    // Détection d'iOS Safari
    function isIOSSafari() {
      const ua = navigator.userAgent;
      const iOS = /iPad|iPhone|iPod/.test(ua);
      const webkit = /WebKit/.test(ua);
      const safari = /Safari/.test(ua);
      return iOS && webkit && safari && !/(CriOS|FxiOS|OPiOS|mercury)/i.test(ua);
    }
    
    // Gestion du clavier virtuel sur mobile
    function handleViewportChange() {
      // Forcer le recalcul de la hauteur du viewport
      const vh = window.innerHeight * 0.01;
      document.documentElement.style.setProperty('--vh', `${vh}px`);
      
      // Empêcher le scroll indésirable
      document.body.style.height = window.innerHeight + 'px';
    }
    
    // Configuration spécifique iOS Safari
    if (isIOSSafari()) {
      // Empêcher le zoom lors du focus sur les inputs
      document.addEventListener('touchstart', function(e) {
        if (e.touches.length > 1) {
          e.preventDefault();
        }
      });
      
      // Empêcher le double-tap zoom
      let lastTouchEnd = 0;
      document.addEventListener('touchend', function(e) {
        const now = (new Date()).getTime();
        if (now - lastTouchEnd <= 300) {
          e.preventDefault();
        }
        lastTouchEnd = now;
      }, false);
    }
    
    // Écouter les changements de taille du viewport
    window.addEventListener('resize', handleViewportChange);
    window.addEventListener('orientationchange', handleViewportChange);
    
    // Initialisation
    handleViewportChange();
    
    // Prévenir le comportement de défilement sur mobile
    document.addEventListener('touchmove', function(e) {
      e.preventDefault();
    }, { passive: false });
    
    // Gérer spécifiquement le clavier virtuel (API moderne)
    if ('virtualKeyboard' in navigator) {
      navigator.virtualKeyboard.overlaysContent = true;
    }
    
    // Native input system for iOS Safari
    let nativeInput = null;
    let flutterInputCallback = null;
    
    window.setupNativeInput = function(callback) {
      if (!isIOSSafari()) return false;
      
      flutterInputCallback = callback;
      
      if (nativeInput) {
        document.body.removeChild(nativeInput);
      }
      
      nativeInput = document.createElement('input');
      nativeInput.type = 'text';
      nativeInput.autocomplete = 'off';
      nativeInput.autocorrect = 'off';
      nativeInput.autocapitalize = 'none';
      nativeInput.spellcheck = false;
      nativeInput.style.cssText = `
        position: fixed;
        left: 20px;
        bottom: 80px;
        width: calc(100% - 40px);
        height: 44px;
        font-size: 16px;
        font-family: 'Courier Prime', monospace;
        background: rgba(0, 20, 0, 0.9);
        color: #00ff00;
        border: 1px solid #00ff00;
        border-radius: 4px;
        padding: 10px;
        z-index: 10000;
        display: none;
        outline: none;
        -webkit-appearance: none;
        -webkit-user-select: text;
        user-select: text;
      `;
      nativeInput.placeholder = 'Entrez votre commande...';
      
      nativeInput.addEventListener('input', function(e) {
        if (flutterInputCallback) {
          flutterInputCallback('INPUT:' + e.target.value);
        }
      });
      
      nativeInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          if (flutterInputCallback) {
            flutterInputCallback('ENTER:' + e.target.value);
          }
        } else if (e.key === 'Escape') {
          e.preventDefault();
          if (flutterInputCallback) {
            flutterInputCallback('ESCAPE:');
          }
        }
      });
      
      document.body.appendChild(nativeInput);
      return true;
    };
    
    window.showNativeInput = function(currentText = '') {
      if (nativeInput && isIOSSafari()) {
        nativeInput.value = currentText;
        nativeInput.style.display = 'block';
        setTimeout(() => {
          nativeInput.focus();
          nativeInput.setSelectionRange(nativeInput.value.length, nativeInput.value.length);
        }, 100);
        return true;
      }
      return false;
    };
    
    window.hideNativeInput = function() {
      if (nativeInput) {
        nativeInput.style.display = 'none';
        nativeInput.blur();
      }
    };
    
    window.updateNativeInput = function(text) {
      if (nativeInput) {
        nativeInput.value = text;
      }
    };

    // Force l'activation du clavier sur iOS Safari
    function forceKeyboardActivation() {
      if (isIOSSafari()) {
        // Créer un input temporaire pour activer le clavier
        const tempInput = document.createElement('input');
        tempInput.type = 'text';
        tempInput.style.position = 'absolute';
        tempInput.style.left = '-9999px';
        tempInput.style.opacity = '0';
        tempInput.style.pointerEvents = 'none';
        tempInput.setAttribute('readonly', 'readonly');
        
        document.body.appendChild(tempInput);
        tempInput.focus();
        
        setTimeout(() => {
          tempInput.blur();
          document.body.removeChild(tempInput);
        }, 100);
      }
    }
    
    // Activer le clavier lors du premier touch sur iOS
    let firstTouch = true;
    document.addEventListener('touchstart', function(e) {
      if (isIOSSafari() && firstTouch) {
        firstTouch = false;
        forceKeyboardActivation();
      }
    }, { once: true });
    
    // Ajouter un gestionnaire global pour l'activation du clavier
    document.addEventListener('click', function(e) {
      if (isIOSSafari()) {
        // Petite pause pour laisser Flutter traiter l'événement
        setTimeout(() => {
          const inputs = document.querySelectorAll('input, textarea');
          inputs.forEach(input => {
            if (input.offsetParent !== null) { // visible
              input.focus();
            }
          });
        }, 50);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
